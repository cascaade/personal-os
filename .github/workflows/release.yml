name: Build Plugins

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all plugins
        run: npm run build

      - name: Package plugins
        run: |
          mkdir -p release

          for plugin in packages/*; do
            if [ -f "$plugin/manifest.json" ]; then
              name=$(basename "$plugin")

              mkdir -p "release/$name"

              cp "$plugin/manifest.json" "release/$name/"
              cp "$plugin/main.js" "release/$name/" 2>/dev/null || true
              cp "$plugin/styles.css" "release/$name/" 2>/dev/null || true

              cd "release/$name"
              zip -r "../$name.zip" .
              cd ../..
            fi
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            release/*.zip \
            --clobber
